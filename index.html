<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>지능형 AI 가계지출 분석앱</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff', 100: '#dbeafe', 300: '#93c5fd', 400: '#60a5fa', 500: '#2563eb', 600: '#1d4ed8', 700: '#1e40af', 800: '#1e3a8a', 900: '#172554'
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    * { font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body { 
      background-color: #f1f5f9;
      overscroll-behavior-y: none; /* iOS 당겨서 새로고침 방지 */
    }

    /* --- [핵심] 모바일 전용 프리폼 엣지 드래그 UX 및 고정 캔버스 스타일 --- */

    /* 1. 자르기 모달 및 컨테이너: 사방 5% 여백(Buffer) 확보 */
    #cropperModal {
      position: fixed;
      inset: 0;
      z-index: 50;
      background-color: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(2px);
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
      display: flex;
      flex-direction: column;
      touch-action: none; /* 브라우저 스크롤/제스처 완전 차단 */
    }

    #cropperContainer {
      position: relative;
      flex: 1;
      margin: 12px;
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      /* [핵심] 상하좌우 5% 여백 공간 부여 (padding-box) */
      padding: 5% !important; 
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    #imageToCrop {
      max-height: 100%;
      max-width: 100%;
      display: block;
    }

    /* 2. [핵심] 조절점 점(Point) 디자인 완전 제거 */
    .cropper-point {
      display: none !important;
    }

    /* 3. [핵심] 테두리 선(Line)을 두꺼운 모바일 터치 핸들로 확장 */
    .cropper-line {
      background-color: transparent !important; /* 시각적 선은 투명하게 */
      opacity: 1 !important;
    }

    /* 테두리 선 위에 가상의 굵은 터치 영역(pseudo-element) 부여 */
    .cropper-line::after {
      content: '';
      position: absolute;
      background-color: transparent;
      /* 손가락 두께만큼 터치 영역 확장 (30~40px) */
      touch-action: none;
    }

    /* 시각적으로 보이는 굵고 선명한 파란 테두리 선 (2px) */
    .cropper-view-box {
      outline: 2px solid #2563eb !important;
      outline-color: #2563eb !important;
      border-radius: 0;
    }

    /* 상단 테두리 핸들 (line-n) */
    .cropper-line.line-n {
      top: 0 !important;
      height: 2px !important;
      background-color: #2563eb !important;
    }
    .cropper-line.line-n::after {
      top: -20px; /* 터치 영역 위로 20px */
      left: 0;
      right: 0;
      height: 40px; /* 전체 터치 영역 40px */
    }

    /* 하단 테두리 핸들 (line-s) */
    .cropper-line.line-s {
      bottom: 0 !important;
      height: 2px !important;
      background-color: #2563eb !important;
    }
    .cropper-line.line-s::after {
      bottom: -20px;
      left: 0;
      right: 0;
      height: 40px;
    }

    /* 좌측 테두리 핸들 (line-w) */
    .cropper-line.line-w {
      left: 0 !important;
      width: 2px !important;
      background-color: #2563eb !important;
    }
    .cropper-line.line-w::after {
      left: -20px;
      top: 0;
      bottom: 0;
      width: 40px;
    }

    /* 우측 테두리 핸들 (line-e) */
    .cropper-line.line-e {
      right: 0 !important;
      width: 2px !important;
      background-color: #2563eb !important;
    }
    .cropper-line.line-e::after {
      right: -20px;
      top: 0;
      bottom: 0;
      width: 40px;
    }

    /* 4. 자르기 영역 배경(Dimming) 및 guides 디자인 */
    .cropper-modal {
      background-color: rgba(0, 0, 0, 0.65) !important;
    }
    .cropper-guides {
      border-color: rgba(255, 255, 255, 0.4) !important;
    }

    /* --- 일반 앱 스타일 --- */
    .scanner-line { animation: scan 2s ease-in-out infinite; }
    @keyframes scan {
      0%, 100% { top: 5%; opacity: 0.2; }
      50% { top: 90%; opacity: 0.9; }
    }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col justify-between selection:bg-brand-500 selection:text-white overflow-hidden">

  <!-- 수동 이미지 자르기 모달 -->
  <div id="cropperModal" class="hidden">
    <!-- 헤더 -->
    <div class="flex items-center justify-between text-white border-b border-slate-700 pb-3 px-4 pt-2">
      <span class="text-sm font-black flex items-center gap-2">
        <i class="fa-solid fa-crop-simple text-amber-400"></i> 영수증 영역 선택 (사방 테두리 조절)
      </span>
      <button type="button" onclick="cancelCrop()" class="text-slate-400 hover:text-white p-1">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
    </div>
    
    <!-- [핵심] 자르기 컨테이너 (CSS에서 5% 패딩 부여) -->
    <div id="cropperContainer">
      <img id="imageToCrop" src="" alt="자르기 원본">
    </div>

    <!-- 푸터 컨트롤 -->
    <div class="space-y-2.5 px-4 pb-4 pt-1">
      <p class="text-[11px] text-slate-300 text-center font-medium leading-relaxed">
        작은 조절점 대신 <strong class="text-brand-300">굵은 파란 테두리 선 전체</strong>를 손가락으로 잡고 <br>
        안쪽/바깥쪽으로 밀어서 사방 여백을 자유롭게 조절하세요.
      </p>
      <div class="grid grid-cols-2 gap-2.5">
        <button type="button" onclick="cancelCrop()" class="w-full bg-slate-700 active:scale-95 text-white font-black text-sm py-3 rounded-xl transition">취소</button>
        <button type="button" onclick="confirmCrop()" class="w-full bg-brand-600 hover:bg-brand-700 active:scale-95 text-white font-black text-sm py-3 rounded-xl shadow-lg flex items-center justify-center gap-1.5 transition">
          <i class="fa-solid fa-check"></i> <span>영역 자르기 완료</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 메인 앱 영역 -->
  <div class="w-full max-w-md mx-auto bg-white min-h-screen flex flex-col shadow-2xl relative border-x border-slate-200">
    
    <!-- 상단 헤더 -->
    <header class="bg-slate-900 text-white px-4 py-3 sticky top-0 z-40 flex items-center justify-between shadow-md">
      <div class="flex items-center gap-2.5 min-w-0 flex-1 pr-2">
        <div class="w-9 h-9 rounded-xl bg-brand-600 flex items-center justify-center text-white shadow-md shrink-0">
          <i class="fa-solid fa-receipt text-lg"></i>
        </div>
        <div class="min-w-0 flex-1">
          <p class="text-[10px] font-black text-brand-300 tracking-tight leading-none mb-1">가계동향조사를 위한</p>
          <h1 class="font-black text-sm tracking-tight text-white truncate leading-none">지능형 AI 가계지출 분석앱</h1>
        </div>
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        <button onclick="resetSystem()" class="text-slate-400 hover:text-white bg-slate-800 p-2 rounded-full active:bg-slate-700 transition" title="초기화">
          <i class="fa-solid fa-rotate-right text-xs"></i>
        </button>
      </div>
    </header>

    <!-- 메인 스크롤 영역 -->
    <main class="flex-1 p-4 space-y-4 overflow-y-auto bg-slate-50">
      
      <!-- 스캐너 섹션 -->
      <section class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm relative overflow-hidden space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-xs font-black text-slate-700 flex items-center gap-1.5">
            <i class="fa-solid fa-camera-retro text-brand-600"></i> 영수증 스캔 상태
          </span>
          <span id="scanStatusBadge" class="text-[11px] bg-slate-100 text-slate-600 border border-slate-200 font-extrabold px-2.5 py-0.5 rounded-full">
            ● 대기 중
          </span>
        </div>

        <div class="relative w-full h-48 bg-slate-50 rounded-xl border-2 border-dashed border-slate-200 flex flex-col items-center justify-center overflow-auto p-2">
          <div id="scannerLine" class="hidden absolute left-2 right-2 h-1 bg-gradient-to-r from-transparent via-brand-600 to-transparent shadow-[0_0_10px_#2563eb] z-20 scanner-line pointer-events-none"></div>
          <div id="receiptPreviewContainer" class="w-full h-full flex flex-col items-center justify-center p-2 text-center">
            <div class="w-12 h-12 rounded-2xl bg-white border border-slate-200 text-slate-400 flex items-center justify-center shadow-sm mb-1.5">
              <i class="fa-solid fa-receipt text-2xl text-brand-500"></i>
            </div>
            <p class="text-xs font-bold text-slate-600">카메라 촬영 또는 사진을 첨부하세요</p>
            <p class="text-[10px] text-slate-400 mt-0.5">배경을 잘라내면 정확도가 높아집니다</p>
          </div>
          <img id="uploadedReceiptImg" src="" alt="첨부 영수증 미리보기" class="hidden w-full h-auto min-h-full object-contain z-10 bg-white rounded-lg shadow-xs">
        </div>

        <input type="file" id="cameraInput" class="hidden" accept="image/*" capture="environment" onchange="handleImageSelected(event, '카메라 촬영')">
        <input type="file" id="galleryInput" class="hidden" accept="image/png, image/jpeg, image/jpg" onchange="handleImageSelected(event, '갤러리')">

        <div class="space-y-2.5 pt-1">
          <div class="grid grid-cols-2 gap-2.5">
            <button type="button" onclick="triggerCamera()" class="w-full bg-slate-800 hover:bg-slate-900 active:scale-95 text-white font-black text-sm py-3 px-2 rounded-xl shadow-md border border-slate-700 transition flex items-center justify-center gap-2">
              <i class="fa-solid fa-camera text-base text-amber-400"></i>
              <span>카메라 촬영</span>
            </button>
            <button type="button" onclick="triggerGallery()" class="w-full bg-slate-800 hover:bg-slate-900 active:scale-95 text-white font-black text-sm py-3 px-2 rounded-xl shadow-md border border-slate-700 transition flex items-center justify-center gap-2">
              <i class="fa-solid fa-image text-base text-blue-400"></i>
              <span>사진 첨부</span>
            </button>
          </div>
          <button type="button" id="analyzeBtn" onclick="startReceiptAnalysis()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 active:scale-98 text-white font-black text-base py-3.5 px-4 rounded-xl shadow-lg border border-blue-700 transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-wand-magic-sparkles text-amber-300 text-lg"></i>
            <span class="tracking-tight">영수증 분석 실행</span>
          </button>
        </div>
      </section>

      <!-- 결과 섹션 (간소화) -->
      <section class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-3">
        <div class="flex items-center gap-2 border-b border-slate-100 pb-2">
          <i class="fa-solid fa-store text-brand-600 text-base"></i>
          <h2 class="font-black text-sm text-slate-900">상호 분석 결과</h2>
        </div>
        <div class="space-y-2 text-xs">
          <div class="bg-slate-50 p-2 rounded-xl border border-slate-100 flex justify-between">
            <span class="font-black text-slate-500">날짜</span><span id="part1Date" class="font-bold text-slate-900">-</span>
          </div>
          <div class="bg-slate-50 p-2 rounded-xl border border-slate-100 space-y-1">
            <span class="font-black text-slate-500">상호명 [AI 복원]</span>
            <p id="part1ShopName" class="font-black text-brand-700 text-sm truncate">-</p>
          </div>
        </div>
      </section>

    </main>
  </div>

  <script>
    let activeReceiptBase64 = null;
    let cropperInstance = null;
    let currentSelectedSource = "";

    function clearAnalysisResidue() {
      activeReceiptBase64 = null;
      document.getElementById('part1Date').innerText = '-';
      document.getElementById('part1ShopName').innerText = '-';
      
      const scanBadge = document.getElementById('scanStatusBadge');
      if(scanBadge) {
        scanBadge.innerText = '● 대기 중';
        scanBadge.className = 'text-[11px] bg-slate-100 text-slate-600 border border-slate-200 font-extrabold px-2.5 py-0.5 rounded-full';
      }

      const img = document.getElementById('uploadedReceiptImg');
      if(img) { img.classList.add('hidden'); img.src = ""; }
      const previewCont = document.getElementById('receiptPreviewContainer');
      if(previewCont) previewCont.classList.remove('hidden');
    }

    function triggerCamera() {
      clearAnalysisResidue();
      const cam = document.getElementById('cameraInput');
      if(cam) { cam.value = ""; cam.click(); }
    }

    function triggerGallery() {
      clearAnalysisResidue();
      const gal = document.getElementById('galleryInput');
      if(gal) { gal.value = ""; gal.click(); }
    }

    function handleImageSelected(event, source) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      clearAnalysisResidue();
      currentSelectedSource = source;

      const reader = new FileReader();
      reader.onload = function (e) {
        const imageToCrop = document.getElementById('imageToCrop');
        imageToCrop.src = e.target.result;
        
        const modal = document.getElementById('cropperModal');
        modal.classList.remove('hidden');
        document.body.style.overflow = 'hidden'; // [고정] 배경 스크롤 차단

        if (cropperInstance) cropperInstance.destroy();

        // --- [핵심] 모바일 전용 프리폼 엣지 드래그 및 고정 캔버스 설정 ---
        cropperInstance = new Cropper(imageToCrop, {
          viewMode: 1,               // 캔버스를 이미지 밖으로 나가지 못하게 제한 (흔들림 방지 기초)
          autoCropArea: 0.9,          // [고정] 시작 시 사방 5% 여백 Safe Zone 확보
          dragMode: 'none',          // 배경 터치 시 새 사각형 그리기 방지
          movable: false,            // 원본 이미지 이동 불가 (액자 고정)
          zoomable: false,           // 핀치 줌 / 더블 터치 확대 불가
          rotatable: false,
          scalable: false,
          toggleDragModeOnDblclick: false,
          responsive: false,         // [고정] 화면 크기 변화에 반응형 동작 차단
          guides: true,
          center: true,
          highlight: false,
          background: false,
          autoCrop: true,
          cropBoxMovable: false,     // [고정] 테두리 잡았을 때 박스 전체 이동 불가 (크기 조절만 작동)
          cropBoxResizable: true,    // 테두리 선 크기 조절 가능
          minCropBoxWidth: 50,
          minCropBoxHeight: 50,
          ready() {
            // [고정] 자르기 영역을 이미지 중앙에 안정적으로 배치
            this.cropper.setCropBoxData(this.cropper.getCropBoxData());
          }
        });
      };
      reader.readAsDataURL(file);
      event.target.value = "";
    }

    function confirmCrop() {
      if (!cropperInstance) return;

      const croppedCanvas = cropperInstance.getCroppedCanvas({
        maxWidth: 1200,
        maxHeight: 1200,
        imageSmoothingEnabled: true,
        imageSmoothingQuality: 'medium'
      });

      activeReceiptBase64 = croppedCanvas.toDataURL('image/jpeg', 0.82);

      const img = document.getElementById('uploadedReceiptImg');
      if (img) { img.src = activeReceiptBase64; img.classList.remove('hidden'); }
      const previewCont = document.getElementById('receiptPreviewContainer');
      if (previewCont) previewCont.classList.add('hidden');

      const scanBadge = document.getElementById('scanStatusBadge');
      if (scanBadge) {
        scanBadge.innerText = `● ${currentSelectedSource} 영역 지정됨 (분석 대기)`;
        scanBadge.className = 'text-[11px] bg-amber-50 text-amber-700 border border-amber-300 font-extrabold px-2.5 py-0.5 rounded-full';
      }

      cancelCrop();
    }

    function cancelCrop() {
      const modal = document.getElementById('cropperModal');
      modal.classList.add('hidden');
      document.body.style.overflow = ''; // 배경 스크롤 복원
      if (cropperInstance) { cropperInstance.destroy(); cropperInstance = null; }
      const imageToCrop = document.getElementById('imageToCrop');
      if (imageToCrop) imageToCrop.src = "";
    }

    // 분석 기능 (시뮬레이션)
    function startReceiptAnalysis() {
      if (!activeReceiptBase64) { alert('영수증 사진을 먼저 첨부해 주세요.'); return; }

      const scanBadge = document.getElementById('scanStatusBadge');
      if(scanBadge) {
        scanBadge.innerText = '● 영수증 분석 중...';
        scanBadge.className = 'text-[11px] bg-blue-50 text-blue-700 border border-blue-300 font-extrabold px-2.5 py-0.5 rounded-full';
      }
      
      const analyzeBtn = document.getElementById('analyzeBtn');
      if(analyzeBtn) analyzeBtn.disabled = true;
      const scannerLine = document.getElementById('scannerLine');
      if(scannerLine) scannerLine.classList.remove('hidden');
      
      setTimeout(() => {
        document.getElementById('part1Date').innerText = '2024-05-20';
        document.getElementById('part1ShopName').innerText = '이마트 천안점 (AI 분석완료)';
        if(scannerLine) scannerLine.classList.add('hidden');
        if(analyzeBtn) analyzeBtn.disabled = false;
        
        if(scanBadge) {
          scanBadge.innerText = '● 분석 완료';
          scanBadge.className = 'text-[11px] bg-emerald-50 text-emerald-700 border border-emerald-300 font-extrabold px-2.5 py-0.5 rounded-full';
        }
      }, 2500);
    }

    function resetSystem() { clearAnalysisResidue(); }
  </script>
</body>
</html>
