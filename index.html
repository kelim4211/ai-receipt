<!-- 상단 헤더 (제목 잘림 방지 및 여유 공간 확보) -->
    <header class="bg-slate-900 text-white px-4 py-3 sticky top-0 z-40 flex items-center justify-between shadow-md">
      <div class="flex items-center gap-2.5 min-w-0 flex-1 pr-2">
        <div class="w-8 h-8 rounded-xl bg-brand-600 flex items-center justify-center text-white shadow-md shrink-0">
          <i class="fa-solid fa-receipt text-sm"></i>
        </div>
        <div class="min-w-0 flex-1">
          <p class="text-[10px] font-bold text-brand-300 leading-none mb-1">가계동향조사</p>
          <h1 class="font-black text-sm tracking-tight text-white whitespace-nowrap leading-none">지능형 AI 가계지출 분석앱</h1>
        </div>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <!-- 잔여 쿼터 배지 -->
        <span id="quotaBadge" class="text-[11px] font-black bg-blue-500/20 text-brand-300 border border-brand-500/40 px-2.5 py-1 rounded-lg">
          잔여 확인 중...
        </span>
        <button onclick="resetSystem()" class="text-slate-400 hover:text-white bg-slate-800 p-2 rounded-full active:bg-slate-700 transition" title="초기화">
          <i class="fa-solid fa-rotate-right text-xs"></i>
        </button>
      </div>
    </header>

    <!-- 마감 시한 강조 안내 바 (눈에 선명하게 들어오는 영역) -->
    <div class="bg-amber-500/10 border-b border-amber-500/20 px-4 py-1.5 flex items-center justify-center gap-1.5 text-amber-800 text-[11px] font-bold">
      <i class="fa-regular fa-clock text-amber-600"></i>
      <span>앱 사용 만료: <strong class="font-extrabold text-amber-900">10월 16일 18시까지</strong></span>
    </div>
